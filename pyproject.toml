[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jointshrink"
version = "0.1.0.dev0"
description = "Joint Bayesian shrinkage for effect summaries and regression"
authors = [{name = "Nilson Chapagain", email = "nchapagain@tamu.edu"}]
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
table = ["pandas>=2"]
dev = ["pytest>=8", "ruff>=0.14", "build>=1.2", "pypdf>=6"]

[project.urls]
Documentation = "https://nilson01.github.io/jointshrink/"
Repository = "https://github.com/nilson01/jointshrink"
Issues = "https://github.com/nilson01/jointshrink/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
